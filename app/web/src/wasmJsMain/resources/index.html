<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 빌드가 %BASE_PATH%를 배포 접두사(루트면 "/", GitHub Pages 프로젝트 사이트면 "/repo/")로 치환한다.
         base 덕분에 /post/... 딥링크에서도 haeti.js 같은 상대 경로가 항상 번들 루트를 가리킨다. -->
    <base href="%BASE_PATH%" />
    <title>Haeti.log</title>
    <!-- 파비콘: SVG(다크 모드면 바탕을 뒤집음)를 우선, 못 쓰는 브라우저는 ICO. 홈 화면 추가용 180px. 원본은 design/icon. -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- 배포 빌드(generateSiteFiles)가 이 자리에 설명·OG·RSS 태그를 페이지마다 채운다. 개발 서버에서는 비어 있다. -->
    <!-- haeti:head -->
    <style>
        :root {
            --bg: #FCFCFD;
            --ink: #16181D;
            --muted: #5B616E;
            --accent: #2B6BEF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #131519;
                --ink: #EDEEF1;
                --muted: #A2A8B4;
                --accent: #6FA3FF;
            }
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            /* 캔버스가 뷰포트를 꽉 채우므로 문서 스크롤은 없어야 한다. 페이지 스크롤은 Compose가 맡는다. */
            overflow: hidden;
            /* 첫 페인트 전 흰 화면 깜빡임을 막기 위해 테마와 같은 배경을 미리 칠한다. */
            background: var(--bg);
        }

        #loader {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: loader-pulse 1.8s ease-in-out infinite;
        }

        .wordmark {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .wordmark .dot-log {
            color: var(--accent);
        }

        /* 브라우저가 WasmGC를 못 쓰면 로더 대신 이 안내를 띄운다. */
        #unsupported {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            word-break: keep-all;
        }

        #unsupported[hidden] {
            display: none;
        }

        #unsupported .wordmark {
            margin-bottom: 28px;
        }

        #unsupported h1 {
            margin: 0 0 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        #unsupported p {
            margin: 0 0 6px;
            max-width: 26em;
            font-size: 15px;
            line-height: 1.6;
            color: var(--muted);
        }

        @keyframes loader-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
    </style>
</head>
<body>
<!-- Compose가 body에 마운트되며 이 로더를 지운다. wasm 다운로드 동안만 보인다. -->
<div id="loader">
    <span class="wordmark">Haeti<span class="dot-log">.log</span></span>
</div>
<div id="unsupported" hidden>
    <span class="wordmark">Haeti<span class="dot-log">.log</span></span>
    <h1>브라우저를 업데이트해 주세요</h1>
    <p>이 사이트는 WebAssembly로 그려서 Safari&nbsp;18.2, Chrome&nbsp;119, Firefox&nbsp;120 이후 버전이 필요합니다.</p>
    <p lang="en">This site needs a recent browser: Safari&nbsp;18.2, Chrome&nbsp;119, Firefox&nbsp;120 or later.</p>
</div>
<script>
    // Kotlin/Wasm은 WasmGC가 필요하다. 구조체 타입 하나뿐인 최소 모듈을 검증해 지원 여부를 미리 본다.
    // 미리 본 검사를 통과해도 컴파일에 실패하면(다른 제안 미지원) 같은 안내로 바꾼다.
    (function () {
        function showUnsupported() {
            var loader = document.getElementById("loader");
            if (loader) loader.remove();
            document.getElementById("unsupported").hidden = false;
        }
        var gcProbe = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]);
        var supported = typeof WebAssembly === "object" && WebAssembly.validate(gcProbe);
        if (!supported) {
            showUnsupported();
            return;
        }
        window.addEventListener("unhandledrejection", function (event) {
            if (event.reason instanceof WebAssembly.CompileError) showUnsupported();
        });
        var script = document.createElement("script");
        script.src = "haeti.js";
        document.body.appendChild(script);
    })();
</script>
</body>
</html>
