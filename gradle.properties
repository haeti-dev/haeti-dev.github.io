# https://docs.gradle.org/current/userguide/build_environment.html#sec:configuring_jvm_memory
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=true

kotlin.code.style=official

# Compose Multiplatform: 리소스가 없는 모듈에도 Res 클래스를 항상 생성한다 (컨벤션 플러그인이 패키지를 고정).
compose.resources.always.generate.accessors=true
