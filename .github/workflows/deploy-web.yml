name: Deploy Web

# app:web의 Kotlin/Wasm 빌드를 GitHub Pages에 배포한다.
#
# - main에 push되면 Build 워크플로(포맷·테스트·두 앱 빌드)가 먼저 돌고, 전부 통과했을 때만
#   그 커밋을 배포한다. 검사가 실패하거나 취소되면 배포하지 않는다.
# - Actions 탭의 workflow_dispatch로 수동 실행하면 검사 없이 main 최신 커밋을 바로 배포한다.
# - Private 저장소에서 GitHub Pages를 쓰려면 GitHub Pro 이상 플랜이 필요하다
#   (Public 저장소는 무료 플랜에서도 가능하다).
# - 커스텀 도메인을 연결하면 배포 경로가 루트가 되므로 basePath는 "/"가 된다.
#   연결 방법: 저장소 Settings -> Pages에서 도메인을 등록하고, 같은 도메인을
#   한 줄만 담은 `CNAME` 파일을 `app/web/src/wasmJsMain/resources/`에 추가해
#   빌드 산출물에 포함시키면 된다.
# - GitHub Pages는 정적 파일만 서빙한다. 글 주소(`post/<slug>/`)와 정적 페이지는
#   빌드가 만든 OG 셸이 응답하고, 그 밖의 경로는 404.html(index.html과 같은 내용)이
#   받는다. 어느 쪽이든 wasm 앱이 부팅해 URL을 읽고 해당 화면을 연다.

on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포는 저장소당 하나뿐이라 두 배포가 서로 경합하면 안 된다. 진행 중인
# 배포는 취소하지 않고 끝까지 완료시킨다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm distribution
    runs-on: ubuntu-latest
    # 수동 실행이거나, main에 push된 커밋의 Build가 성공했을 때만. PR 실행은 브랜치 이름이
    # main이어도(포크 등) 배포하지 않는다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      # 검사를 통과한 바로 그 커밋을 빌드한다. 그 사이 main에 새 커밋이 와도 섞이지 않는다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # BASE_PATH: index.html의 <base href>와 라우팅 접두사. SITE_URL: OG·sitemap·RSS의 절대 주소.
      # - 저장소 이름이 <user>.github.io면 루트(/)에, 그 외에는 프로젝트 페이지(/<repo>/)에 배포된다.
      # - 커스텀 도메인을 붙이면 저장소 변수 SITE_URL(Settings -> Secrets and variables -> Actions ->
      #   Variables)에 `https://도메인`을 넣는다. 그러면 경로는 루트(/)가 된다.
      - name: Resolve base path and site URL
        env:
          CUSTOM_URL: ${{ vars.SITE_URL }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "$CUSTOM_URL" ]]; then
            base="/"; url="${CUSTOM_URL%/}"
          elif [[ "$REPO" == *.github.io ]]; then
            base="/"; url="https://$owner.github.io"
          else
            base="/$REPO/"; url="https://$owner.github.io/$REPO"
          fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"

      - run: ./gradlew :app:web:prepareGitHubPages -Phaeti.basePath=$BASE_PATH -Phaeti.siteUrl=$SITE_URL --stacktrace

      # prepareGitHubPages 산출물(app/web/build/pages)에는 404.html과 .nojekyll이
      # 이미 포함되어 있다 (app/web/build.gradle.kts의 Copy 태스크가 만든다).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/build/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
