name: Build

# main 브랜치로의 push와 PR마다 포맷·테스트·두 앱의 빌드 가능 여부를 검증한다.
# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck --stacktrace

  test:
    name: Unit Tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # commonTest는 jvm 타깃에서 실행한다. wasmJs 브라우저 테스트 태스크는
      # 컨벤션 플러그인(build-logic)에서 이미 비활성화되어 있다. CI/로컬 어디에도
      # Chrome 기반 Karma 러너가 없기 때문이다. 테스트 소스 자체는 wasmJs로도
      # 컴파일되므로 타깃 간 API 호환성은 컴파일 시점에 계속 검증된다.
      - run: ./gradlew jvmTest --stacktrace
      # 발행 글의 영어 번역본이 있고 최신인지 점검한다. 지금은 경고만 남긴다
      # (막으려면 -Phaeti.strictTranslations=true). 절차는 docs/PUBLISHING.md.
      - run: ./gradlew :core:data:checkTranslations
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  web:
    name: Web (wasm) Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # 배포와 같은 산출물(번들 + OG 셸·sitemap·RSS)을 만든다. 생성기 테스트(build-logic)도 함께 돈다.
      - run: ./gradlew :app:web:prepareGitHubPages -Phaeti.siteUrl=https://example.github.io --stacktrace
      - run: ./gradlew -p build-logic test --stacktrace

  admin:
    name: Admin Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # app:admin은 로컬 전용 집필 도구라 배포하지 않는다. 여기서는 빌드와 JVM 테스트만
      # 검증한다 (실행이나 패키징은 하지 않음). jvmTest는 KMP 모듈만 돌아 어드민 테스트를 포함하지 않는다.
      - run: ./gradlew :app:admin:assemble :app:admin:test --stacktrace
